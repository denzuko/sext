name: CI

# LISP must be set explicitly -- 40ants/setup-lisp@v4's own docs claim
# it defaults to sbcl when unset, but a real run (2026-06-21) showed
# its own internal self-check step ("Checking if we installed correct
# Lisp implementation", test.ros) hard-failing with "Env variable LISP
# was not set." before any of this workflow's own steps even ran --
# discovered only by actually checking real GitHub Actions run logs
# via the API, not from any local verification (which never exercises
# 40ants/setup-lisp@v4 at all). Every working example in the action's
# own documentation sets this explicitly too, so this isn't relying on
# undocumented behavior.
env:
  LISP: sbcl-bin

on:
  push:
    branches: ["main", "develop", "feat/**", "fix/**", "chore/**", "refactor/**", "ci/**"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  # ── Primary: FiveAM unit tests ──────────────────────────────────────────
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Common Lisp
        uses: 40ants/setup-lisp@v4
        with:
          asdf-system: sext
        # NOTE: no qlfile-template here -- 40ants/setup-lisp runs
        # `qlot install` against this repo's own checked-out qlfile by
        # default when qlfile-template isn't given, which is what we
        # want: the qlfile is the single source of truth for
        # dependencies (see qlfile's own header for the full
        # project-vs-system-name evidence trail; an earlier version of
        # this workflow had a stale inline duplicate here that drifted
        # out of sync with the real qlfile and was missing Cleavir,
        # concrete-syntax-tree, eclector, and khazern entirely).

      - name: Run FiveAM unit tests
        uses: 40ants/run-tests@v2
        with:
          asdf-system: sext
          run-tests: |
            (asdf:test-system :sext)

  # ── Linting: sblint + Lisp Critic ───────────────────────────────────────
  # 40ants-ci/jobs/linter and jobs/critic (issue #8) are NOT GitHub Actions
  # to reference via `uses:` -- confirmed by direct investigation (40ants-ci
  # is a Lisp-side workflow GENERATOR: a defworkflow DSL that PRODUCES
  # .github/workflows/*.yml content; the YAML it generates uses
  # 40ants/setup-lisp@v4 plus a plain `run: qlot exec sblint <asd>` /
  # `lisp-critic`-equivalent step). See CLAUDE.md, "Issue #8 notes" for the
  # full evidence trail, including why this job does NOT actually use
  # `qlot exec` (it isolates sblint/lisp-critic from their own Quicklisp-
  # installed dependencies like swank) and uses a direct Cleavir checkout +
  # CL_SOURCE_REGISTRY instead.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: 40ants/setup-lisp@v4
        with:
          asdf-system: sext
      - name: Clone Cleavir for source-registry (not in any Quicklisp dist)
        run: git clone --depth 1 https://github.com/s-expressionists/Cleavir.git /tmp/cleavir-checkout
      - name: Install sblint and lisp-critic
        run: |
          ros install fukamachi/sblint
          ros install 40ants/40ants-critic
      # Was non-blocking pending investigation of a `Component "trinsic"
      # not found` failure, traced into sblint's own khazern-extrinsic
      # dependency walk. Re-investigated (2026-06-21): "trinsic" is a
      # real, legitimate transitive dependency -- it appears in
      # sblint's own normal "Loading N systems" list on a clean run,
      # right after khazern-extrinsic/khazern, not as a missing
      # component. The earlier failure was reproduced not being
      # reproducible against a fresh sblint install/Quicklisp dist
      # (re-installed sblint, cleared ~/.cache/common-lisp, re-ran
      # against the exact CI command/CL_SOURCE_REGISTRY twice) -- almost
      # certainly a stale local dist/cache artifact from earlier in
      # that session, not a real bug in this repo or in the
      # CL_SOURCE_REGISTRY approach itself. Re-enabled as blocking.
      - name: Lint with sblint
        env:
          CL_SOURCE_REGISTRY: '(:source-registry (:tree "/tmp/cleavir-checkout/") :inherit-configuration)'
        run: ~/.roswell/bin/sblint sext.asd
      # ADVISORY by design, not just pending investigation: verified
      # working end-to-end, but a live run against this exact codebase
      # flagged CLEAVIR-ENVIRONMENT:EVAL's (EVAL FORM) call as
      # "[evil-eval]" -- a deliberate, already-documented design choice
      # (see src/main.lisp's %CST-TO-AST docstring and environment.lisp's
      # "EVAL / CST-EVAL" section), not a real problem. That's good
      # evidence this job belongs as idiom/style guidance a human reviews,
      # not a hard gate that would force working around its false
      # positives.
      - name: Critique with Lisp Critic (advisory)
        continue-on-error: true
        env:
          CL_SOURCE_REGISTRY: '(:source-registry (:tree "/tmp/cleavir-checkout/") (:directory "./") :inherit-configuration)'
        run: ros -e '(asdf:load-system :40ants-critic :verbose nil)' -e '(40ants-critic:critique-asdf-system :sext)'

  # ── Build: Roswell binary ───────────────────────────────────────────────
  build:
    needs: [unit-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: 40ants/setup-lisp@v4
        with:
          asdf-system: sext
      - name: Build sext binary via Roswell
        run: |
          ros build roswell/sext.ros
      - name: Verify binary
        run: |
          ./roswell/sext --help
          ./roswell/sext --help | grep -q "Usage:"
