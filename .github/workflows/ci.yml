name: CI

on:
  push:
    branches: ["main", "develop", "feat/**", "fix/**", "chore/**", "refactor/**", "ci/**"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  # ── Primary: FiveAM unit tests ──────────────────────────────────────────
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Common Lisp
        uses: 40ants/setup-lisp@v4
        with:
          asdf-system: sext
          qlfile-template: |
            ql fiveam
            ql com.inuoe.jzon
            ql trivial-json-codec

      - name: Run FiveAM unit tests
        uses: 40ants/run-tests@v2
        with:
          asdf-system: sext
          run-tests: |
            (asdf:test-system :sext)

  # ── Linting: sblint (fukamachi) via 40ants-ci job ──────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: 40ants/setup-lisp@v4
        with:
          asdf-system: sext
      # NOTE for next session: confirm exact 40ants-ci/jobs/linter usage --
      # this may need to be a `40ants-ci` Lisp-side job invocation rather
      # than a standalone GitHub Action; check 40ants-ci's actual
      # distribution mechanism (is it a GH Action, or a Lisp system you
      # asdf:load and call from within a run-tests-style step?) before
      # finalizing this job. Placeholder below assumes a GH Action exists;
      # verify and correct.
      - name: Lint with sblint
        run: |
          ros install fukamachi/sblint
          ~/.roswell/bin/sblint sext.asd

  # ── Build: Roswell binary ───────────────────────────────────────────────
  build:
    needs: [unit-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: 40ants/setup-lisp@v4
        with:
          asdf-system: sext
      - name: Build sext binary via Roswell
        run: |
          ros build roswell/sext.ros
      - name: Verify binary
        run: |
          ./roswell/sext --help || true  # NOTE: --help not yet implemented, see src/main.lisp stub
